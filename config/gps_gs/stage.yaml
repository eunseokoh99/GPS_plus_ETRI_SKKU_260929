# gps_gs -- the official GPS-Gaussian+ baseline.
#   2 rectified source views (lmain/rmain of one stereo segment)
#   -> LoFTR row cross-attention -> RAFT-Stereo disparity -> GSRegresser.
#   Both source views' Gaussians are merged for every render.
#   Chamfer regularization between the two source point clouds is ON.
name: 'gps_gs'
model_type: 'GPSGS'
use_chamfer: True

lr: 0.0002
wdecay: 1e-5
batch_size: 1
num_steps: 100000

dataset:
  source_id: [0, 1]
  train_novel_id: [2, 3, 4, 5]
  val_novel_id: [3]
  use_hr_img: False
  use_depth_init: True
  use_local_data: True
  inverse_depth_init: 0.3
  eval_img_hcrop: 0.1
  # Rectified dataset. LoFTR cross-attends within a single image row, so
  # corresponding points must share a y coordinate -- which is what
  # rectification guarantees. See data_process/data_process.md (--rect).
  local_data_root: '{PREPROCESSED_PATH}'
  train_data_root: '{PREPROCESSED_PATH}/train'
  val_data_root: '{PREPROCESSED_PATH}/val'

raft:
  mixed_precision: False
  train_iters: 3
  val_iters: 3
  encoder_dims: [32, 48, 96]
  hidden_dims: [96, 96, 96]

gsnet:
  encoder_dims: [32, 48, 96]
  decoder_dims: [48, 64, 96]
  parm_head_dim: 32

record:
  loss_freq: 1000
  eval_freq: 1000
  save_freq: 5000
  use_ema: True

wandb:
  project: ETRI_GPS_plus
  name: gps_gs
